<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* 黑客帝国风格字符雨画布（协议 / method 字符掉落） */
      #rain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #e6e6e6;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        pointer-events: none;
      }
      #loading .brand {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #4a7cc4;
        text-shadow: 0 0 12px rgba(46, 89, 167, 0.55), 0 0 40px rgba(46, 89, 167, 0.35);
      }
      #loading .hint {
        font-size: 12px;
        color: #2e59a7;
        letter-spacing: 3px;
        text-shadow: 0 0 8px rgba(46, 89, 167, 0.5);
        animation: loading-blink 1.6s ease-in-out infinite;
      }
      @keyframes loading-blink {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="rain"></canvas>
    <div id="loading">
      <div class="brand">API Manager</div>
      <div class="hint">加载中…</div>
    </div>
    <script type="module" src="/src/loading.ts"></script>
  </body>
</html>
