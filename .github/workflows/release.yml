name: release

# 触发方式：
# 1. 推送 tag（如 v0.5.0）：git tag v0.5.0 && git push origin v0.5.0
# 2. 手动触发：仓库 Actions 页面选择 release → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # macOS Apple Silicon
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # Linux（AppImage / deb / rpm）
          - platform: 'ubuntu-22.04'
            args: ''
          # Windows（NSIS 安装包 / MSI）
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要同时编译两个架构（Intel + Apple Silicon）后由 tauri 合并
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin aarch64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'API Manager v__VERSION__'
          releaseBody: |
            ## API Manager v__VERSION__

            请根据操作系统下载对应安装包：

            - **Windows**：`.msi` 或 `-setup.exe`（NSIS 安装程序）
            - **macOS**：`.dmg`（`aarch64` 为 Apple Silicon，`x86_64` 为 Intel）
            - **Linux**：`.AppImage`（免安装）、`.deb`（Debian/Ubuntu）、`.rpm`（Fedora/openSUSE）

            > 说明：当前为草稿版本，确认无误后点击「Publish release」即可正式发布。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
