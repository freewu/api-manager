<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #14161a;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #14161a;
        color: #e6e6e6;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #loading .spinner {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4da3ff;
        animation: loading-spin 0.8s linear infinite;
      }
      #loading .brand {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      #loading .hint {
        font-size: 12px;
        color: #9aa0a6;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div class="brand">API Manager</div>
      <div class="hint">加载中…</div>
    </div>
    <script type="module" src="/src/loading.ts"></script>
  </body>
</html>
