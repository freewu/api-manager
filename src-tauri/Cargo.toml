[package]
name = "api-manager"
version = "0.1.6"
description = "API 接口文档、测试与 Mock 应用"
authors = ["api-manager"]
edition = "2021"
rust-version = "1.77.2"

[features]
# 生产构建（tauri build / just release）时启用，将前端资源内嵌进可执行文件；
# 开发模式（just dev）不启用，保持 vite 热更新。请勿删除。
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "api_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "deflate", "charset", "multipart"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
percent-encoding = "2"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
