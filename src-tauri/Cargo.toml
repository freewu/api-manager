[package]
name = "api-manager"
version = "0.1.0"
description = "API 接口文档、测试与 Mock 应用"
authors = ["api-manager"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "api_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "deflate", "charset"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
percent-encoding = "2"
encoding_rs = "0.8"
