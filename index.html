<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Manager</title>
    <style>
      /* 兜底加载动画（主应用 JS 解析期间防白屏；正式动画在独立 loading.html） */
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14161a;
      }
      #boot-loading .spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4da3ff;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-loading.fade-out {
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loading"><div class="spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
