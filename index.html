<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loading">
      <style>
        #boot-loading {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #14161a;
          color: #e6e6e6;
          font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
          transition: opacity 0.25s ease;
        }
        #boot-loading .spinner {
          width: 42px;
          height: 42px;
          border-radius: 50%;
          border: 3px solid rgba(255, 255, 255, 0.15);
          border-top-color: #4da3ff;
          animation: boot-spin 0.8s linear infinite;
        }
        #boot-loading .brand {
          font-size: 18px;
          font-weight: 600;
          letter-spacing: 1px;
        }
        #boot-loading .hint {
          font-size: 12px;
          color: #9aa0a6;
        }
        #boot-loading.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="spinner"></div>
      <div class="brand">API Manager</div>
      <div class="hint">加载中…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
